name: ci
on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  # x86-64 + ARM64, all three OSes, and both GCC and Clang explicitly on
  # Linux — the whole point of isobit is that these legs agree bit-for-bit
  # (see the bitexact-digest job below), so the matrix has to actually span
  # the architectures/compilers the README promises, not just the OSes.
  build:
    strategy:
      fail-fast: false
      matrix:
        # Every (os, arch, cc, cxx) leg listed twice, once per config.
        # NOTE: do NOT split this back into `include:` + a separate
        # `config: [...]` array — GitHub Actions does not cross-multiply
        # them when the include entries share no key with the array; it
        # silently collapses the whole matrix down to just `config`'s two
        # values, all using the LAST include entry's os/cc. That bug ran
        # unnoticed for a few commits: every "cross-platform" CI pass was
        # actually only macos-14/arm64/clang built twice. Explicit full
        # list is more verbose but is the only way that's actually
        # verified to cross-multiply correctly.
        include:
          - os: ubuntu-latest
            arch: x86-64
            cc: gcc
            cxx: g++
            config: Release
          - os: ubuntu-latest
            arch: x86-64
            cc: gcc
            cxx: g++
            config: Debug
          - os: ubuntu-latest
            arch: x86-64
            cc: clang
            cxx: clang++
            config: Release
          - os: ubuntu-latest
            arch: x86-64
            cc: clang
            cxx: clang++
            config: Debug
          - os: ubuntu-24.04-arm
            arch: arm64
            cc: gcc
            cxx: g++
            config: Release
          - os: ubuntu-24.04-arm
            arch: arm64
            cc: gcc
            cxx: g++
            config: Debug
          - os: windows-latest
            arch: x86-64
            # clang-cl, not cl.exe: CORE-MATH's vendored sources
            # (third_party/core-math/) use GNU C extensions throughout
            # (__attribute__, __builtin_*, __int128, inline asm) that
            # cl.exe cannot parse at all. clang-cl understands them while
            # staying MSVC-ABI-compatible for linking against the rest of
            # the toolchain, so it's the real fix, not a workaround.
            cc: clang-cl
            cxx: clang-cl
            config: Release
          - os: windows-latest
            arch: x86-64
            cc: clang-cl
            cxx: clang-cl
            config: Debug
          - os: macos-14
            arch: arm64
            cc: clang
            cxx: clang++
            config: Release
          - os: macos-14
            arch: arm64
            cc: clang
            cxx: clang++
            config: Debug
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup MSVC dev environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Setup Ninja
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v6
      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.cc }}" = "clang-cl" ]; then
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DISOBIT_SHARED=ON \
              -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DISOBIT_SHARED=ON \
              -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          fi
      - name: Build
        run: cmake --build build --config ${{ matrix.config }}
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure
      - name: Capture bit-exact digest
        # scalar.cpp is now the real correctly-rounded implementation for
        # every function (all five vendored from CORE-MATH, plus hardware
        # sqrt) — this is the actual product claim, so it's a hard gate:
        # the bitexact-verify job below fails the run if any leg's digest
        # differs from any other's.
        shell: bash
        run: |
          BIN=""
          for c in "build/tests/test_bitexact_golden" "build/tests/test_bitexact_golden.exe" \
                   "build/tests/${{ matrix.config }}/test_bitexact_golden" \
                   "build/tests/${{ matrix.config }}/test_bitexact_golden.exe"; do
            if [ -f "$c" ]; then BIN="$c"; break; fi
          done
          "$BIN" > digest.txt
          cat digest.txt
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.cc }}-${{ matrix.config }}
          path: digest.txt

  bitexact-verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
      - name: Diff every leg's digest against the first
        # Windows' CRT writes text-mode stdout with CRLF line endings even
        # though the values printed are identical byte patterns — strip \r
        # before comparing so a real bit-exact mismatch isn't masked by (or
        # confused with) a line-ending artifact of how each OS's stdio
        # redirects text output.
        shell: bash
        run: |
          cd digests
          first="$(ls -1 | head -1)"
          echo "Reference leg: $first"
          tr -d '\r' < "$first/digest.txt" > "$first/digest.norm.txt"
          cat "$first/digest.norm.txt"
          status=0
          for d in */; do
            d="${d%/}"
            if [ "$d" = "$first" ]; then continue; fi
            tr -d '\r' < "$d/digest.txt" > "$d/digest.norm.txt"
            if ! diff -u "$first/digest.norm.txt" "$d/digest.norm.txt"; then
              echo "::error::bit-exact mismatch: $d differs from $first"
              status=1
            fi
          done
          exit $status

  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: |
          cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build-san
      - name: Test
        run: ctest --test-dir build-san --output-on-failure
